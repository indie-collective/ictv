# ICTV kiosk profile (loaded via --config-dir, so ~/.config/mpv is ignored)

fullscreen=yes
idle=yes
force-window=yes
keep-open=yes
# Open the next playlist entry while the snow plays (see main.lua)
prefetch-playlist=yes
# Start at the nearest keyframe instead of decoding up to the exact frame: shorter load after the snow
hr-seek=no
osc=no
osd-level=0
cursor-autohide=always
stop-screensaver=yes
ytdl=no

# Raspberry Pi 4: hardware decode, cheap scaling
vo=gpu
# 'auto' finds no hwdec on the Pi 4 and silently falls back to software decoding.
# v4l2m2m-copy uses the VideoCore decoder (/dev/video10) and copies frames back for GL.
hwdec=v4l2m2m-copy
hwdec-codecs=h264
vd-lavc-threads=2
video-sync=audio
framedrop=vo
demuxer-max-bytes=64MiB
demuxer-max-back-bytes=8MiB
scale=bilinear
dscale=bilinear
cscale=bilinear
dither-depth=no
correct-downscaling=no
linear-downscaling=no
sigmoid-upscaling=no
deband=no

# Normalisation can boost quiet clips above 100%
volume-max=300
